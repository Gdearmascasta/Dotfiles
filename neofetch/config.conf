# neofetch para Ubuntu, que en 24.04 no trae fastfetch. Lo genera tema-ubuntu.py desde
# fastfetch/config.jsonc: no lo edites a mano.

c() { printf '\e[38;2;%d;%d;%dm' "0x${1:1:2}" "0x${1:3:2}" "0x${1:5:2}"; }

# Una línea propia solo si el comando dio algo, como hace fastfetch con los módulos vacíos.
linea() { [[ -n $2 ]] && prin "$1" "$2"; }

cursor_tema() {
    command -v gsettings >/dev/null || return
    local tema tam
    tema=$(gsettings get org.gnome.desktop.interface cursor-theme 2>/dev/null | tr -d "'")
    tam=$(gsettings get org.gnome.desktop.interface cursor-size 2>/dev/null)
    [[ -n $tema ]] && printf '%s (%spx)' "$tema" "$tam"
}

swap_uso() {
    free -b 2>/dev/null | awk '/^Swap/ && $2 > 0 {printf "%.2f GiB / %.2f GiB (%d%%)", $3/2^30, $2/2^30, 100*$3/$2}'
}

sonido() {
    command -v wpctl >/dev/null || return
    wpctl inspect @DEFAULT_AUDIO_SINK@ 2>/dev/null | sed -n 's/.*node\.description = "\(.*\)"/\1/p' | head -1
}

reproductor() { command -v playerctl >/dev/null && playerctl metadata --format '{{playerName}}' 2>/dev/null; }
cancion() { command -v playerctl >/dev/null && playerctl metadata --format '{{title}} - {{artist}}' 2>/dev/null; }

print_info() {
    prin
    info "$(c '#AEA79F') DISTRO" distro
    info "$(c '#AEA79F')│ ├" kernel
    info "$(c '#AEA79F')│ ├󰏖" packages
    info "$(c '#AEA79F')│ └" shell
    info "$(c '#DEDBD8') DE/WM" wm
    info "$(c '#DEDBD8')│ ├󰉼" wm_theme
    info "$(c '#DEDBD8')│ ├󰀻" icons
    linea "$(c '#DEDBD8')│ ├" "$(cursor_tema)"
    info "$(c '#DEDBD8')│ ├" term_font
    info "$(c '#DEDBD8')│ └" term
    info "$(c '#E95420')󰌢 SYSTEM" model
    info "$(c '#E95420')│ ├󰻠" cpu
    info "$(c '#E95420')│ ├󰻑" gpu
    info "$(c '#E95420')│ ├󰍹" resolution
    info "$(c '#E95420')│ ├󰾆" memory
    linea "$(c '#E95420')│ ├󰓡" "$(swap_uso)"
    info "$(c '#E95420')│ └󰅐" uptime
    linea "$(c '#AD79A8') AUDIO" "$(sonido)"
    linea "$(c '#AD79A8')│ ├󰥠" "$(reproductor)"
    linea "$(c '#AD79A8')│ └󰝚" "$(cancion)"
    prin "\e[38;2;174;167;159m  \e[38;2;255;255;255m  \e[38;2;233;84;32m  \e[38;2;173;121;168m"
    prin
}

separator=" 󰑃  "
bold="on"
colors=(15 15 15 15 7 7)
kernel_shorthand="on"
distro_shorthand="off"
os_arch="on"
uptime_shorthand="on"
memory_percent="on"
memory_unit="gib"
package_managers="on"
shell_path="off"
shell_version="on"
cpu_brand="on"
cpu_speed="on"
cpu_cores="logical"
gpu_brand="on"
gpu_type="all"
refresh_rate="on"
de_version="on"
color_blocks="off"

image_backend="ascii"
image_source="auto"
ascii_distro="auto"
# 202 es el naranja de 256 colores más cercano a #E95420: neofetch no acepta hex en el logo.
ascii_colors=(202 15)
ascii_bold="on"
gap=3
