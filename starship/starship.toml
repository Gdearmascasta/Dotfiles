format = """
[](#2B3A67)\
$python\
$username\
[](bg:#3C6EB4 fg:#2B3A67)\
$directory\
[](fg:#3C6EB4 bg:#294172)\
$git_branch\
$git_status\
[](fg:#294172 bg:#51A2DA)\
$c\
$elixir\
$elm\
$golang\
$haskell\
$java\
$julia\
$nodejs\
$nim\
$rust\
[](fg:#51A2DA bg:#1D2D52)\
$docker_context\
[](fg:#1D2D52 bg:#3C6EB4)\
$time\
[ ](fg:#3C6EB4)\
"""
command_timeout = 5000
# Disable the blank line at the start of the prompt
# add_newline = false

# You can also replace your username with a neat symbol like  to save some space
[username]
show_always = true
style_user = "bg:#2B3A67"
style_root = "bg:#2B3A67"
format = '[$user ]($style)'

[directory]
style = "bg:#3C6EB4"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

# Here is how you can shorten some long paths by text replacement
# similar to mapped_locations in Oh My Posh:
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
# Keep in mind that the order matters. For example:
# "Important Documents" = "  "
# will not be replaced, because "Documents" was already substituted before.
# So either put "Important Documents" before "Documents" or use the substituted version:
# "Important  " = "  "

[c]
symbol = " "
style = "bg:#51A2DA"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
style = "bg:#1D2D52"
format = '[ $symbol $context ]($style)$path'

[elixir]
symbol = " "
style = "bg:#51A2DA"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "bg:#51A2DA"
format = '[ $symbol ($version) ]($style)'

[git_branch]
symbol = ""
style = "bg:#294172"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:#294172"
format = '[$all_status$ahead_behind ]($style)'

[golang]
symbol = " "
style = "bg:#51A2DA"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "bg:#51A2DA"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bg:#51A2DA"
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = " "
style = "bg:#51A2DA"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "bg:#51A2DA"
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = " "
style = "bg:#51A2DA"
format = '[ $symbol ($version) ]($style)'

[python]
style = "bg:#2B3A67"
format = '[(\($virtualenv\) )]($style)'

[rust]
symbol = ""
style = "bg:#51A2DA"
format = '[ $symbol ($version) ]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#3C6EB4"
format = '[ $time ]($style)'
