# Apariencia y Colores
background #1B2430
background_opacity 0.85
font_family JetBrainsMonoNL Nerd Font
font_size 14
window_padding_width 8
hide_window_decorations yes

# Comportamiento
# Nota: arranque maximizado via Exec=kitty --start-as=maximized
# en ~/.local/share/applications/kitty.desktop (kitty no tiene opcion de config para esto)
# Sin barra de scroll lateral (modo lectura)
scrollbar never
confirm_os_window_close 0
copy_on_select yes
shell_integration enabled
allow_remote_control yes
listen_on unix:/tmp/kitty-{kitty_pid}
detect_urls yes
url_style curly
